name: culturemate

services:
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_KAKAO_MAP_KEY: ${KAKAO_MAP_KEY:-}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mariadb://db:3306/${DB_NAME:-culturemate}
      DB_USERNAME: ${DB_USERNAME:-culturemate}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 넣어 주세요}
      SEOUL_API_KEY: ${SEOUL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      KAKAO_REST_KEY: ${KAKAO_REST_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
      KAKAO_REDIRECT_URI: ${DOCKER_KAKAO_REDIRECT_URI:-http://localhost/api/auth/kakao/callback}
      FRONTEND_URL: ${DOCKER_FRONTEND_URL:-http://localhost}
      FRONTEND_ORIGIN: ${DOCKER_FRONTEND_URL:-http://localhost}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      PLACES_SEARCH_MONTHLY_LIMIT: ${PLACES_SEARCH_MONTHLY_LIMIT:-900}
      PLACES_PHOTO_MONTHLY_LIMIT: ${PLACES_PHOTO_MONTHLY_LIMIT:-900}
      PLACES_DETAIL_MONTHLY_LIMIT: ${PLACES_DETAIL_MONTHLY_LIMIT:-900}
      PLACES_SEARCH_PER_MINUTE: ${PLACES_SEARCH_PER_MINUTE:-20}
      PLACES_PHOTO_PER_MINUTE: ${PLACES_PHOTO_PER_MINUTE:-40}
      PLACES_DETAIL_PER_MINUTE: ${PLACES_DETAIL_PER_MINUTE:-20}
      PLACES_SEARCH_PER_MEMBER_DAILY: ${PLACES_SEARCH_PER_MEMBER_DAILY:-20}
      PLACES_PHOTO_PER_MEMBER_DAILY: ${PLACES_PHOTO_PER_MEMBER_DAILY:-20}
      PLACES_DETAIL_PER_MEMBER_DAILY: ${PLACES_DETAIL_PER_MEMBER_DAILY:-20}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  db:
    image: mariadb:10.11
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: ${DB_NAME:-culturemate}
      MARIADB_USER: ${DB_USERNAME:-culturemate}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 넣어 주세요}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
